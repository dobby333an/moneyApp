<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人理財記帳 App</title>
    
    <!-- PWA & iOS 支援標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="記帳App">
    <meta name="theme-color" content="#059669">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes slideUp {
            from { transform: translateY(10%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex justify-center pb-[env(safe-area-inset-bottom)]">

    <div id="app" class="w-full max-w-md bg-gray-50 shadow-2xl relative overflow-hidden flex flex-col h-[100dvh]">
        
        <!-- 載入中動畫畫面 -->
        <div id="loading-screen" class="absolute inset-0 bg-gray-50 z-50 flex flex-col items-center justify-center">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500 font-medium">同步雲端與本地資料中...</p>
        </div>

        <!-- 可捲動的主內容區 -->
        <div class="flex-1 overflow-y-auto">
            <!-- 綠色儀表板 Header -->
            <header class="bg-emerald-600 text-white pt-12 pb-8 px-6 rounded-b-3xl shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-bold tracking-wide">我的記帳</h1>
                        <span id="sync-indicator" class="flex h-2 w-2 relative hidden" title="雲端同步中">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-200 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-300"></span>
                        </span>
                    </div>
                    <button onclick="openSettingsModal()" class="bg-emerald-700/50 hover:bg-emerald-700 p-2 rounded-full transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287-.947c.886.54 2.042.061 2.287-.947 1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <div class="mb-6">
                    <p class="text-emerald-100 text-sm mb-1">總資產 (淨值)</p>
                    <h2 id="net-asset-display" class="text-4xl font-extrabold">$0</h2>
                </div>

                <!-- 時間區間切換按鈕 -->
                <div class="flex justify-center mb-5">
                    <div class="bg-emerald-800/40 p-1 rounded-lg flex text-xs w-full max-w-[240px]">
                        <button onclick="setTimeRange('thisMonth')" id="btn-range-thisMonth" class="flex-1 py-1.5 rounded-md transition-colors bg-emerald-600 text-white font-bold shadow-sm">本期</button>
                        <button onclick="setTimeRange('sixMonths')" id="btn-range-sixMonths" class="flex-1 py-1.5 rounded-md transition-colors text-emerald-100 hover:bg-emerald-700/50">近半年</button>
                        <button onclick="setTimeRange('allTime')" id="btn-range-allTime" class="flex-1 py-1.5 rounded-md transition-colors text-emerald-100 hover:bg-emerald-700/50">全部</button>
                    </div>
                </div>

                <!-- 收支小卡 -->
                <div class="flex bg-emerald-700/30 p-4 rounded-2xl backdrop-blur-sm mb-4">
                    <div class="flex-1">
                        <p id="label-income" class="text-emerald-100 text-[11px] mb-1">本期收入</p>
                        <p id="period-income-display" class="font-semibold text-white text-sm">$0</p>
                    </div>
                    <div class="w-px bg-emerald-500/50 mx-2"></div>
                    <div class="flex-1">
                        <p id="label-expense" class="text-emerald-100 text-[11px] mb-1">本期支出</p>
                        <p id="period-expense-display" class="font-semibold text-white text-sm">$0</p>
                    </div>
                    <div class="w-px bg-emerald-500/50 mx-2"></div>
                    <div class="flex-1">
                        <p id="label-net" class="text-emerald-100 text-[11px] mb-1">本期結餘</p>
                        <p id="period-net-display" class="font-semibold text-sm text-white">$0</p>
                    </div>
                </div>

                <!-- 預算進度條 -->
                <div class="bg-emerald-700/30 p-4 rounded-2xl backdrop-blur-sm">
                    <div class="flex justify-between items-end">
                        <p class="text-emerald-100 text-xs">
                            本期預算餘額 <span class="text-[10px] opacity-75">(每月5號重置)</span>
                        </p>
                        <p id="budget-remaining-display" class="font-bold text-sm">$15,000</p>
                    </div>
                    <div class="w-full bg-black/20 rounded-full h-2 mt-2 overflow-hidden">
                        <div id="budget-progress-bar" class="h-full rounded-full bg-emerald-300 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </header>

            <main class="p-6 pb-32">
                <!-- 視圖切換 (明細 / 統計) -->
                <div class="flex bg-gray-200/70 p-1 rounded-xl mb-5">
                    <button onclick="setActiveView('list')" id="btn-view-list" class="flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow-sm text-gray-800 transition-colors">歷史明細</button>
                    <button onclick="setActiveView('stats')" id="btn-view-stats" class="flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-colors">統計分析</button>
                </div>

                <!-- 列表容器 -->
                <div id="records-container"></div>
                <!-- 統計容器 -->
                <div id="stats-container" class="space-y-4 hidden"></div>
            </main>
        </div>

        <!-- 浮動新增按鈕 (FAB) -->
        <div class="absolute bottom-8 left-0 right-0 flex justify-center px-6 pointer-events-none">
            <button onclick="openAddModal()" class="pointer-events-auto bg-gray-900 text-white shadow-xl rounded-full px-6 py-3.5 flex items-center gap-2 hover:bg-gray-800 transition-transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="font-bold">記一筆</span>
            </button>
        </div>

        <!-- 新增/編輯 Modal -->
        <div id="add-modal" class="absolute inset-0 z-50 bg-black/60 flex flex-col justify-end hidden">
            <div class="bg-white rounded-t-3xl w-full p-6 animate-slide-up h-[85vh] flex flex-col">
                <div class="flex justify-between items-center mb-6 shrink-0">
                    <h3 id="modal-title" class="text-xl font-bold">新增紀錄</h3>
                    <button onclick="closeAddModal()" class="p-2 bg-gray-100 rounded-full text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto pb-6 space-y-4">
                    <div class="flex bg-gray-100 p-1 rounded-xl">
                        <button onclick="setAddType('expense')" id="type-expense" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-gray-800">支出</button>
                        <button onclick="setAddType('income')" id="type-income" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-500">收入</button>
                        <button onclick="setAddType('pay_card')" id="type-pay_card" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-500">繳卡費</button>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">日期時間</label>
                        <input type="datetime-local" id="input-date" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 text-gray-900" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">金額</label>
                        <input type="number" inputmode="decimal" id="input-amount" class="w-full text-3xl font-bold border-b-2 border-gray-200 py-2 focus:outline-none focus:border-emerald-500 bg-transparent text-gray-900" placeholder="0" />
                    </div>

                    <div id="category-section">
                        <label class="block text-xs font-bold text-gray-500 mb-2">分類</label>
                        <div id="category-buttons" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div id="payment-section">
                        <label id="payment-label" class="block text-xs font-bold text-gray-500 mb-2">付款方式</label>
                        <select id="input-payment" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 text-gray-900"></select>
                    </div>

                    <div id="installment-section" class="bg-blue-50 p-3 rounded-xl space-y-3 hidden">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-blue-900">💳 信用卡分期付款</p>
                                <p class="text-xs text-blue-700/70">自動將金額拆分至未來月份</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="input-installment-toggle" onchange="toggleInstallmentUI()" class="sr-only peer" />
                                <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 peer-checked:bg-blue-500"></div>
                            </label>
                        </div>
                        <div id="installment-months-box" class="flex gap-2 hidden">
                            <button onclick="setInstallmentMonths(3)" id="inst-3" class="flex-1 py-1.5 text-sm font-bold rounded-lg border bg-blue-600 text-white border-blue-600 shadow">3期</button>
                            <button onclick="setInstallmentMonths(6)" id="inst-6" class="flex-1 py-1.5 text-sm font-bold rounded-lg border bg-white text-blue-600 border-blue-200">6期</button>
                            <button onclick="setInstallmentMonths(12)" id="inst-12" class="flex-1 py-1.5 text-sm font-bold rounded-lg border bg-white text-blue-600 border-blue-200">12期</button>
                            <button onclick="setInstallmentMonths(24)" id="inst-24" class="flex-1 py-1.5 text-sm font-bold rounded-lg border bg-white text-blue-600 border-blue-200">24期</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">備註 (選填)</label>
                        <input type="text" id="input-note" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 text-gray-900" placeholder="例如：晚餐、買衣服..." />
                    </div>

                    <div id="budget-deduct-section" class="flex items-center justify-between p-3 bg-emerald-50 rounded-xl">
                        <div>
                            <p class="text-sm font-bold text-emerald-900">扣除生活預算</p>
                            <p class="text-xs text-emerald-700/70">非日常大額支出可關閉</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="input-deduct" checked class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 peer-checked:bg-emerald-500"></div>
                        </label>
                    </div>

                    <button onclick="saveRecord()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-4 active:bg-emerald-700">確認儲存</button>
                </div>
            </div>
        </div>

        <!-- 設定 Modal -->
        <div id="settings-modal" class="absolute inset-0 z-50 bg-black/60 flex flex-col justify-end hidden">
            <div class="bg-white rounded-t-3xl w-full p-6 h-[85vh] flex flex-col animate-slide-up">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">設定</h3>
                    <button onclick="closeSettingsModal()" class="p-2 bg-gray-100 rounded-full text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto space-y-6 pb-6">
                    <div>
                        <h4 class="font-bold text-gray-700 mb-2">每月生活預算</h4>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">$</span>
                            <input type="number" inputmode="numeric" id="input-budget-setting" onchange="updateBudgetAmount()" class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 font-bold text-gray-900" />
                        </div>
                    </div>

                    <hr class="border-gray-100" />

                    <div>
                        <h4 class="font-bold text-gray-700 mb-3">信用卡管理</h4>
                        <div id="cards-list-container" class="space-y-3 mb-3"></div>
                        
                        <div id="new-card-box" class="hidden flex gap-2 mb-3">
                            <input type="text" id="input-new-card-name" placeholder="信用卡名稱" class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none text-gray-900" />
                            <button onclick="confirmAddCard()" class="px-4 bg-emerald-600 text-white font-bold rounded-xl shrink-0">儲存</button>
                            <button onclick="toggleCardInput(false)" class="px-4 bg-gray-200 text-gray-700 font-bold rounded-xl shrink-0">取消</button>
                        </div>
                        <button id="btn-show-card-input" onclick="toggleCardInput(true)" class="w-full py-3 border-2 border-dashed border-emerald-300 text-emerald-600 font-bold rounded-xl hover:bg-emerald-50 transition-colors">+ 新增信用卡</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'finance-app-id';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;

        let db = null, auth = null;
        if (firebaseConfigStr) {
            try {
                const config = JSON.parse(firebaseConfigStr);
                const app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (e) {
                console.error("Firebase 初始化失敗:", e);
            }
        }

        // 全域應用狀態
        window.state = {
            user: null,
            records: [],
            cards: [{ id: 'card-1', name: '預設信用卡' }],
            budgetAmount: 15000,
            timeRange: 'thisMonth',
            activeView: 'list',
            addType: 'expense',
            category: '飲食',
            paymentMethod: 'cash',
            isInstallment: false,
            installmentMonths: 3,
            editingRecordId: null
        };

        const expenseCategories = ['飲食', '交通', '購物', '娛樂', '居住', '其他'];
        const incomeCategories = ['薪水', '投資', '獎金', '其他'];
        const categoryColors = {
            '飲食': 'bg-orange-400', '交通': 'bg-blue-400', '購物': 'bg-pink-400',
            '娛樂': 'bg-purple-400', '居住': 'bg-teal-400', '其他': 'bg-gray-400'
        };

        window.onload = function() {
            // 讀取本地備份
            try {
                const savedRecords = localStorage.getItem('finance_records_backup');
                const savedCards = localStorage.getItem('finance_cards_backup');
                const savedBudget = localStorage.getItem('finance_budget_backup');
                if (savedRecords) window.state.records = JSON.parse(savedRecords);
                if (savedCards) window.state.cards = JSON.parse(savedCards);
                if (savedBudget) window.state.budgetAmount = Number(savedBudget);
            } catch (e) { console.error(e); }

            if (!auth) {
                document.getElementById('loading-screen').style.display = 'none';
                renderApp();
                return;
            }

            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("登入錯誤:", err);
                    document.getElementById('loading-screen').style.display = 'none';
                    renderApp();
                }
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                window.state.user = user;
                if (!user) {
                    document.getElementById('loading-screen').style.display = 'none';
                    renderApp();
                    return;
                }
                setupFirebaseListeners(user.uid);
            });
        };

        function setupFirebaseListeners(userId) {
            const configRef = doc(db, 'artifacts', appId, 'users', userId, 'finance_config', 'main');
            onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.cards && data.cards.length > 0) window.state.cards = data.cards;
                    if (data.budgetAmount !== undefined) window.state.budgetAmount = data.budgetAmount;
                }
                renderApp();
            }, (err) => console.error("同步設定錯誤:", err));

            const recordsRef = collection(db, 'artifacts', appId, 'users', userId, 'finance_records');
            onSnapshot(recordsRef, (snapshot) => {
                const fetchedRecords = snapshot.docs.map(d => d.data());
                
                const cloudIds = new Set(fetchedRecords.map(r => r.id));
                const missingInCloud = window.state.records.filter(r => !cloudIds.has(r.id));
                
                if (missingInCloud.length > 0) {
                    missingInCloud.forEach(r => {
                        setDoc(doc(db, 'artifacts', appId, 'users', userId, 'finance_records', r.id), r).catch(e => console.error(e));
                    });
                }

                window.state.records = [...fetchedRecords, ...missingInCloud].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('sync-indicator').classList.remove('hidden');
                renderApp();
            }, (err) => {
                console.error("同步紀錄錯誤:", err);
                document.getElementById('loading-screen').style.display = 'none';
                renderApp();
            });
        }

        window.saveStateToStorage = function() {
            try {
                localStorage.setItem('finance_records_backup', JSON.stringify(window.state.records));
                localStorage.setItem('finance_cards_backup', JSON.stringify(window.state.cards));
                localStorage.setItem('finance_budget_backup', window.state.budgetAmount.toString());

                if (window.state.user && db) {
                    setDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'finance_config', 'main'), {
                        cards: window.state.cards, budgetAmount: window.state.budgetAmount
                    }, { merge: true }).catch(e => console.error(e));
                }
            } catch (e) { console.error(e); }
        };

        // 核心渲染與計算邏輯
        window.renderApp = function() {
            const stats = calculateStats();
            
            // 更新儀表板數據
            document.getElementById('net-asset-display').innerText = formatMoney(stats.netAsset);
            document.getElementById('period-income-display').innerText = formatMoney(stats.periodIncome);
            document.getElementById('period-expense-display').innerText = formatMoney(stats.periodExpense);
            
            const netDisplay = document.getElementById('period-net-display');
            netDisplay.innerText = (stats.periodNetIncome > 0 ? '+' : '') + formatMoney(stats.periodNetIncome);
            netDisplay.className = `font-semibold text-sm ${stats.periodNetIncome < 0 ? 'text-red-300' : 'text-white'}`;

            const budgetRemaining = Math.max(0, window.state.budgetAmount - stats.monthBudgetUsed);
            document.getElementById('budget-remaining-display').innerText = formatMoney(budgetRemaining);
            const budgetPct = Math.min((stats.monthBudgetUsed / window.state.budgetAmount) * 100, 100);
            const bar = document.getElementById('budget-progress-bar');
            bar.style.width = budgetPct + '%';
            bar.className = `h-full rounded-full transition-all duration-500 ${stats.monthBudgetUsed > window.state.budgetAmount ? 'bg-red-400' : 'bg-emerald-300'}`;

            // 更新時間區間與檢視切換狀態
            ['thisMonth', 'sixMonths', 'allTime'].forEach(tr => {
                const btn = document.getElementById(`btn-range-${tr}`);
                if (window.state.timeRange === tr) {
                    btn.className = "flex-1 py-1.5 rounded-md transition-colors bg-emerald-600 text-white font-bold shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-md transition-colors text-emerald-100 hover:bg-emerald-700/50";
                }
            });

            const rangeLabel = window.state.timeRange === 'thisMonth' ? '本期' : window.state.timeRange === 'sixMonths' ? '近半年' : '全部';
            document.getElementById('label-income').innerText = rangeLabel + '收入';
            document.getElementById('label-expense').innerText = rangeLabel + '支出';
            document.getElementById('label-net').innerText = rangeLabel + '結餘';

            if (window.state.activeView === 'list') {
                document.getElementById('btn-view-list').className = "flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow-sm text-gray-800 transition-colors";
                document.getElementById('btn-view-stats').className = "flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-colors";
                document.getElementById('records-container').classList.remove('hidden');
                document.getElementById('stats-container').classList.add('hidden');
                renderRecordsList();
            } else {
                document.getElementById('btn-view-list').className = "flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-colors";
                document.getElementById('btn-view-stats').className = "flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow-sm text-gray-800 transition-colors";
                document.getElementById('records-container').classList.add('hidden');
                document.getElementById('stats-container').classList.remove('hidden');
                renderStatsView(stats);
            }
        };

        function calculateStats() {
            let cash = 0, periodExpense = 0, periodIncome = 0, monthBudgetUsed = 0;
            const cardBalances = {};
            window.state.cards.forEach(c => cardBalances[c.id] = 0);
            const categoryTotals = {};

            const now = new Date();
            const currentPeriodStart = new Date(now.getFullYear(), now.getMonth(), 5);
            if (now.getDate() < 5) currentPeriodStart.setMonth(currentPeriodStart.getMonth() - 1);
            currentPeriodStart.setHours(0, 0, 0, 0);
            
            const currentPeriodEnd = new Date(currentPeriodStart);
            currentPeriodEnd.setMonth(currentPeriodEnd.getMonth() + 1);

            const sixMonthsAgo = new Date();
            sixMonthsAgo.setMonth(now.getMonth() - 6);

            window.state.records.forEach(r => {
                const rDate = new Date(r.date);
                const isThisPeriod = rDate >= currentPeriodStart && rDate < currentPeriodEnd;
                const isPastSixMonths = rDate >= sixMonthsAgo;
                const isFuture = rDate >= currentPeriodEnd;

                let isInRange = false;
                if (window.state.timeRange === 'thisMonth') isInRange = isThisPeriod;
                else if (window.state.timeRange === 'sixMonths') isInRange = isPastSixMonths && !isFuture;
                else if (window.state.timeRange === 'allTime') isInRange = true;

                if (rDate <= now) {
                    if (r.type === 'income') cash += r.amount;
                    if (r.type === 'expense' && r.paymentMethod === 'cash') cash -= r.amount;
                    if (r.type === 'pay_card') {
                        cash -= r.amount;
                        if (cardBalances[r.paymentMethod] !== undefined) cardBalances[r.paymentMethod] -= r.amount;
                    }
                }

                if (r.type === 'expense' && r.paymentMethod !== 'cash') {
                    if (cardBalances[r.paymentMethod] !== undefined) cardBalances[r.paymentMethod] += r.amount;
                }

                if (r.type === 'income' && isInRange) periodIncome += r.amount;
                else if (r.type === 'expense') {
                    if (isThisPeriod && r.deductBudget) monthBudgetUsed += r.amount;
                    if (isInRange) {
                        periodExpense += r.amount;
                        categoryTotals[r.category] = (categoryTotals[r.category] || 0) + r.amount;
                    }
                }
            });

            const totalCardDebt = Object.values(cardBalances).reduce((a, b) => a + b, 0);
            const netAsset = cash - totalCardDebt;
            const periodNetIncome = periodIncome - periodExpense;

            const categoryStats = Object.keys(categoryTotals).map(cat => ({
                name: cat,
                amount: categoryTotals[cat],
                percentage: periodExpense > 0 ? (categoryTotals[cat] / periodExpense) * 100 : 0
            })).sort((a, b) => b.amount - a.amount);

            return { cash, periodExpense, periodIncome, monthBudgetUsed, cardBalances, totalCardDebt, netAsset, periodNetIncome, categoryStats };
        }

        function renderRecordsList() {
            const container = document.getElementById('records-container');
            const filtered = getFilteredRecords();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-10 flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p>這個區間還沒有任何紀錄喔！</p>
                    </div>`;
                return;
            }

            let html = '<div class="space-y-3">';
            filtered.forEach(r => {
                const isExpense = r.type === 'expense';
                const isPayCard = r.type === 'pay_card';
                const cardObj = window.state.cards.find(c => c.id === r.paymentMethod);
                const cardName = cardObj ? cardObj.name : '信用卡';
                const catColor = categoryColors[r.category] || (isExpense ? 'bg-red-400' : 'bg-emerald-400');

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between group hover:shadow-md transition-shadow">
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-inner shrink-0 ${isExpense ? catColor : isPayCard ? 'bg-blue-400' : 'bg-emerald-400'}">
                                ${r.category.substring(0, 1)}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-0.5">
                                    <p class="font-bold text-gray-800 truncate">${r.category}</p>
                                    ${isExpense && !r.deductBudget ? '<span class="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded shrink-0">不計預算</span>' : ''}
                                </div>
                                <div class="text-xs text-gray-400 truncate w-full">
                                    <span>${new Date(r.date).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' })}</span>
                                    <span class="mx-1">•</span>
                                    <span class="${r.paymentMethod !== 'cash' ? 'text-blue-500' : ''}">${r.paymentMethod === 'cash' ? '現金' : cardName}</span>
                                    ${r.note ? `<span class="mx-1">•</span><span class="truncate">${r.note}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0 pl-2">
                            <p class="font-bold ${isExpense ? 'text-red-500' : isPayCard ? 'text-blue-500' : 'text-emerald-500'}">
                                ${isExpense ? '-' : isPayCard ? '' : '+'}${formatMoney(r.amount)}
                            </p>
                            <div class="flex items-center gap-1">
                                <button onclick="editRecord('${r.id}')" class="text-gray-400 p-1.5 hover:bg-gray-100 hover:text-gray-600 rounded">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                                </button>
                                <button onclick="deleteRecord('${r.id}')" class="text-red-300 p-1.5 hover:bg-red-50 hover:text-red-500 rounded">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderStatsView(stats) {
            const container = document.getElementById('stats-container');
            const rangeLabel = window.state.timeRange === 'thisMonth' ? '本期' : window.state.timeRange === 'sixMonths' ? '近半年' : '全部';

            if (stats.categoryStats.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10">${rangeLabel}尚無支出紀錄可以統計喔！</div>`;
                return;
            }

            let html = `<h3 class="text-sm font-bold text-gray-500 mb-2">${rangeLabel}支出分佈</h3>`;
            stats.categoryStats.forEach(cat => {
                const color = categoryColors[cat.name] || 'bg-gray-400';
                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-end mb-2">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full ${color}"></span>
                                <span class="font-bold text-gray-700">${cat.name}</span>
                            </div>
                            <div class="text-right">
                                <span class="font-bold text-gray-900">${formatMoney(cat.amount)}</span>
                                <span class="text-xs text-gray-400 ml-2">${cat.percentage.toFixed(1)}%</span>
                            </div>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                            <div class="h-full rounded-full ${color}" style="width: ${cat.percentage}%"></div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function getFilteredRecords() {
            const now = new Date();
            const currentPeriodStart = new Date(now.getFullYear(), now.getMonth(), 5);
            if (now.getDate() < 5) currentPeriodStart.setMonth(currentPeriodStart.getMonth() - 1);
            currentPeriodStart.setHours(0, 0, 0, 0);
            const currentPeriodEnd = new Date(currentPeriodStart);
            currentPeriodEnd.setMonth(currentPeriodEnd.getMonth() + 1);

            const sixMonthsAgo = new Date();
            sixMonthsAgo.setMonth(now.getMonth() - 6);

            return window.state.records.filter(r => {
                const rDate = new Date(r.date);
                if (window.state.timeRange === 'thisMonth') return rDate >= currentPeriodStart && rDate < currentPeriodEnd;
                if (window.state.timeRange === 'sixMonths') return rDate >= sixMonthsAgo && rDate <= now;
                return true;
            });
        }

        window.setTimeRange = function(range) {
            window.state.timeRange = range;
            renderApp();
        };

        window.setActiveView = function(view) {
            window.state.activeView = view;
            renderApp();
        };

        window.formatMoney = function(num) {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(num);
        };

        function getLocalDatetimeStr(dateObj = new Date()) {
            const d = new Date(dateObj);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 16);
        }

        // Modal 與表單邏輯
        window.openAddModal = function() {
            window.state.editingRecordId = null;
            document.getElementById('modal-title').innerText = '新增紀錄';
            document.getElementById('input-date').value = getLocalDatetimeStr();
            document.getElementById('input-amount').value = '';
            document.getElementById('input-note').value = '';
            setAddType('expense');
            document.getElementById('add-modal').classList.remove('hidden');
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.add('hidden');
        };

        window.setAddType = function(type) {
            window.state.addType = type;
            ['expense', 'income', 'pay_card'].forEach(t => {
                const btn = document.getElementById(`type-${t}`);
                if (t === type) {
                    btn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-gray-800";
                } else {
                    btn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-500";
                }
            });

            const catSection = document.getElementById('category-section');
            const paySection = document.getElementById('payment-section');
            const instSection = document.getElementById('installment-section');
            const budgetSection = document.getElementById('budget-deduct-section');

            if (type === 'pay_card') {
                catSection.classList.add('hidden');
                instSection.classList.add('hidden');
                budgetSection.classList.add('hidden');
                paySection.classList.remove('hidden');
                document.getElementById('payment-label').innerText = '繳納哪張信用卡？';
            } else if (type === 'income') {
                catSection.classList.remove('hidden');
                paySection.classList.add('hidden');
                instSection.classList.add('hidden');
                budgetSection.classList.add('hidden');
                renderCategoryButtons(incomeCategories);
            } else {
                catSection.classList.remove('hidden');
                paySection.classList.remove('hidden');
                budgetSection.classList.remove('hidden');
                renderCategoryButtons(expenseCategories);
                document.getElementById('payment-label').innerText = '付款方式';
                checkInstallmentVisibility();
            }
            renderPaymentOptions();
        };

        function renderCategoryButtons(categories) {
            if (!categories.includes(window.state.category)) window.state.category = categories[0];
            const container = document.getElementById('category-buttons');
            let html = '';
            categories.forEach(cat => {
                const isSelected = window.state.category === cat;
                html += `<button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-full text-sm font-medium border ${isSelected ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-200'}">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        window.setCategory = function(cat) {
            window.state.category = cat;
            renderCategoryButtons(window.state.addType === 'expense' ? expenseCategories : incomeCategories);
        };

        function renderPaymentOptions() {
            const select = document.getElementById('input-payment');
            let html = '';
            if (window.state.addType !== 'pay_card') {
                html += `<option value="cash" ${window.state.paymentMethod === 'cash' ? 'selected' : ''}>現金</option>`;
            }
            window.state.cards.forEach(c => {
                html += `<option value="${c.id}" ${window.state.paymentMethod === c.id ? 'selected' : ''}>${c.name}</option>`;
            });
            select.innerHTML = html;
            select.onchange = (e) => {
                window.state.paymentMethod = e.target.value;
                checkInstallmentVisibility();
            };
            checkInstallmentVisibility();
        }

        function checkInstallmentVisibility() {
            const instSection = document.getElementById('installment-section');
            const payVal = document.getElementById('input-payment').value;
            if (window.state.addType === 'expense' && payVal !== 'cash' && !window.state.editingRecordId) {
                instSection.classList.remove('hidden');
            } else {
                instSection.classList.add('hidden');
            }
        }

        window.toggleInstallmentUI = function() {
            window.state.isInstallment = document.getElementById('input-installment-toggle').checked;
            const box = document.getElementById('installment-months-box');
            if (window.state.isInstallment) box.classList.remove('hidden');
            else box.classList.add('hidden');
        };

        window.setInstallmentMonths = function(m) {
            window.state.installmentMonths = m;
            [3, 6, 12, 24].forEach(months => {
                const btn = document.getElementById(`inst-${months}`);
                if (months === m) {
                    btn.className = "flex-1 py-1.5 text-sm font-bold rounded-lg border bg-blue-600 text-white border-blue-600 shadow";
                } else {
                    btn.className = "flex-1 py-1.5 text-sm font-bold rounded-lg border bg-white text-blue-600 border-blue-200";
                }
            });
        };

        window.editRecord = function(id) {
            const record = window.state.records.find(r => r.id === id);
            if (!record) return;

            window.state.editingRecordId = record.id;
            document.getElementById('modal-title').innerText = '修改紀錄';
            document.getElementById('input-date').value = getLocalDatetimeStr(record.date);
            document.getElementById('input-amount').value = record.amount;
            document.getElementById('input-note').value = record.note || '';
            document.getElementById('input-deduct').checked = record.deductBudget ?? true;
            
            setAddType(record.type);
            window.state.category = record.category;
            window.state.paymentMethod = record.paymentMethod;
            
            if (record.type === 'expense') renderCategoryButtons(expenseCategories);
            else if (record.type === 'income') renderCategoryButtons(incomeCategories);
            renderPaymentOptions();

            document.getElementById('add-modal').classList.remove('hidden');
        };

        window.saveRecord = function() {
            const amountInput = document.getElementById('input-amount').value;
            if (!amountInput || isNaN(amountInput) || Number(amountInput) <= 0) return;
            const totalAmount = Number(amountInput);
            const dateStr = document.getElementById('input-date').value;
            const noteStr = document.getElementById('input-note').value.trim();
            const payMethod = document.getElementById('input-payment').value;
            const deductBudget = document.getElementById('input-deduct').checked;
            const baseDate = new Date(dateStr);

            if (window.state.editingRecordId) {
                const updated = {
                    id: window.state.editingRecordId,
                    date: baseDate.toISOString(),
                    type: window.state.addType,
                    amount: totalAmount,
                    note: noteStr,
                    category: window.state.addType === 'pay_card' ? '信用卡費' : window.state.category,
                    paymentMethod: (window.state.addType === 'income' || window.state.addType === 'pay_card') ? (window.state.addType === 'pay_card' ? payMethod : 'cash') : payMethod,
                    deductBudget: window.state.addType === 'expense' ? deductBudget : false
                };

                if (window.state.user && db) {
                    setDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'finance_records', updated.id), updated).catch(e => console.error(e));
                }
                window.state.records = window.state.records.map(r => r.id === updated.id ? updated : r).sort((a, b) => new Date(b.date) - new Date(a.date));
            } else {
                let newRecords = [];
                if (window.state.addType === 'expense' && payMethod !== 'cash' && window.state.isInstallment) {
                    const months = window.state.installmentMonths;
                    const perMonth = Math.floor(totalAmount / months);
                    const remainder = totalAmount % months;

                    for (let i = 0; i < months; i++) {
                        const instDate = new Date(baseDate);
                        instDate.setMonth(instDate.getMonth() + i);
                        newRecords.push({
                            id: 'rec-' + Date.now() + '-' + i,
                            date: instDate.toISOString(),
                            type: 'expense',
                            amount: i === 0 ? perMonth + remainder : perMonth,
                            note: noteStr ? `${noteStr} (${i + 1}/${months}期)` : `(${i + 1}/${months}期)`,
                            category: window.state.category,
                            paymentMethod: payMethod,
                            deductBudget: deductBudget
                        });
                    }
                } else {
                    newRecords.push({
                        id: 'rec-' + Date.now(),
                        date: baseDate.toISOString(),
                        type: window.state.addType,
                        amount: totalAmount,
                        note: noteStr,
                        category: window.state.addType === 'pay_card' ? '信用卡費' : window.state.category,
                        paymentMethod: (window.state.addType === 'income' || window.state.addType === 'pay_card') ? (window.state.addType === 'pay_card' ? payMethod : 'cash') : payMethod,
                        deductBudget: window.state.addType === 'expense' ? deductBudget : false
                    });
                }

                if (window.state.user && db) {
                    newRecords.forEach(r => {
                        setDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'finance_records', r.id), r).catch(e => console.error(e));
                    });
                }
                window.state.records = [...newRecords, ...window.state.records].sort((a, b) => new Date(b.date) - new Date(a.date));
            }

            window.saveStateToStorage();
            closeAddModal();
            renderApp();
        };

        window.deleteRecord = function(id) {
            if (window.state.user && db) {
                deleteDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'finance_records', id)).catch(e => console.error(e));
            }
            window.state.records = window.state.records.filter(r => r.id !== id);
            window.saveStateToStorage();
            renderApp();
        };

        // 設定 Modal 邏輯
        window.openSettingsModal = function() {
            document.getElementById('input-budget-setting').value = window.state.budgetAmount;
            renderCardsSettings();
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').classList.add('hidden');
        };

        window.updateBudgetAmount = function() {
            const val = Number(document.getElementById('input-budget-setting').value);
            if (!isNaN(val) && val >= 0) {
                window.state.budgetAmount = val;
                window.saveStateToStorage();
                renderApp();
            }
        };

        function renderCardsSettings() {
            const stats = calculateStats();
            const container = document.getElementById('cards-list-container');
            let html = '';
            window.state.cards.forEach(card => {
                const debt = stats.cardBalances[card.id] || 0;
                html += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 border border-gray-100 rounded-xl">
                        <div>
                            <p class="font-bold text-gray-800">${card.name}</p>
                            <p class="text-xs text-red-500 mt-1 font-semibold">未繳餘額: ${formatMoney(debt)}</p>
                        </div>
                        <button onclick="removeCard('${card.id}')" class="text-red-400 p-2 hover:bg-red-50 rounded">刪除</button>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.toggleCardInput = function(show) {
            const box = document.getElementById('new-card-box');
            const btn = document.getElementById('btn-show-card-input');
            if (show) {
                box.classList.remove('hidden');
                btn.classList.add('hidden');
                document.getElementById('input-new-card-name').value = '';
                document.getElementById('input-new-card-name').focus();
            } else {
                box.classList.add('hidden');
                btn.classList.remove('hidden');
            }
        };

        window.confirmAddCard = function() {
            const name = document.getElementById('input-new-card-name').value.trim();
            if (name) {
                window.state.cards.push({ id: 'card-' + Date.now(), name });
                window.saveStateToStorage();
                toggleCardInput(false);
                renderCardsSettings();
                renderApp();
            }
        };

        window.removeCard = function(id) {
            window.state.cards = window.state.cards.filter(c => c.id !== id);
            window.saveStateToStorage();
            renderCardsSettings();
            renderApp();
        };
    </script>
</body>
</html>
